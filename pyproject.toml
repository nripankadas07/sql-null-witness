[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sql-null-witness"
version = "0.1.0"
description = "Parse a strict SQL predicate subset and explain TRUE/FALSE/UNKNOWN results and retained row indexes with an AST and postorder trace."
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []
[project.scripts]
sql-null-witness = "sql_null_witness:main"
[tool.setuptools]
py-modules = ["sql_null_witness"]
